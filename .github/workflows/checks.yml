# Repository hygiene checks.
#
# Deliberately modest. docs/ARCHITECTURE.md ("CI reality") explains why: a
# GitHub-hosted runner cannot build Chromium — it does not have the disk for the
# source tree, let alone the build. Real builds move to a self-hosted or cloud macOS
# builder; the ADR for which one is BACKLOG.md S-49, and it is overdue. Until then CI
# does the things it genuinely can do, and does not pretend to do the rest.
#
# Every check here also runs locally with the same command, so a red CI is always
# reproducible on a developer machine.

name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        # Pinned, because shellcheck versions disagree about real findings and
        # the runner's apt version drifts. tooling/check-shell warns when a
        # developer's local version differs from this one.
        run: |
          version="$(cat tooling/shellcheck-version)"
          url="https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz"
          curl -fsSL "$url" | tar -xJ
          sudo install "shellcheck-v${version}/shellcheck" /usr/local/bin/shellcheck
          rm -rf "shellcheck-v${version}"
          shellcheck --version

      - name: shellcheck and bash syntax
        # Calls the same script a developer runs, so CI and a local machine
        # cannot disagree about what the check is.
        run: tooling/check-shell

  repo:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Documentation links, ADR format, patch series, no machine paths
        run: tooling/check-repo

      - name: The pin check's own verdict logic
        # Offline fixtures, no network: the three states check-pin reports are the
        # reason it exists, and the upstream workflow acts on them unattended.
        run: tooling/check-pin --self-test
