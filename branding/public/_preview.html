<!doctype html>
<meta charset="utf-8">
<title>Stedding brand</title>
<style>
  body { margin:0; font:16px/1.6 -apple-system,system-ui,sans-serif; background:#F2E9DE; color:#1C2B33; }
  main { max-width:920px; margin:0 auto; padding:48px 24px 96px; }
  h1 { font-weight:500; font-size:28px; margin:0 0 4px; }
  p.sub { margin:0 0 40px; color:#5A6B75; }
  h2 { font-weight:500; font-size:18px; margin:40px 0 16px; }
  .row { display:flex; flex-wrap:wrap; gap:20px; align-items:flex-end; }
  .cell { text-align:center; }
  .cell img { display:block; image-rendering:auto; }
  .cell span { display:block; margin-top:8px; font-size:12px; color:#5A6B75; }
  .dark { background:#2F4858; padding:24px; border-radius:12px; }
  .sw { display:flex; gap:16px; flex-wrap:wrap; }
  .sw div { width:132px; }
  .chip { height:56px; border-radius:8px; border:1px solid rgba(0,0,0,.12); }
  code { font:13px ui-monospace,monospace; }
</style>
<main>
  <h1>Stedding</h1>
  <p class="sub">An arch sheltering a warm point of light. Judge every revision at 16px first.</p>

  <h2>Actual size</h2>
  <div class="row">
    <div class="cell"><img src="png/icon-16.png" width="16" height="16" alt=""><span>16</span></div>
    <div class="cell"><img src="png/icon-32.png" width="32" height="32" alt=""><span>32</span></div>
    <div class="cell"><img src="png/icon-48.png" width="48" height="48" alt=""><span>48</span></div>
    <div class="cell"><img src="png/icon-64.png" width="64" height="64" alt=""><span>64</span></div>
    <div class="cell"><img src="png/icon-128.png" width="128" height="128" alt=""><span>128</span></div>
  </div>

  <h2>Shapes</h2>
  <div class="row">
    <div class="cell"><img src="svg/icon-tile-slate.svg" width="96" height="96" alt=""><span>tile</span></div>
    <div class="cell"><img src="svg/icon-square-slate.svg" width="96" height="96" alt=""><span>square</span></div>
    <div class="cell"><img src="svg/icon-circle-slate.svg" width="96" height="96" alt=""><span>circle</span></div>
    <div class="cell"><img src="svg/icon-tile-cream.svg" width="96" height="96" alt=""><span>tile, light</span></div>
  </div>

  <h2>On dark</h2>
  <div class="dark row">
    <div class="cell"><img src="svg/icon-glyph-cream.svg" width="96" height="96" alt=""><span style="color:#F2E9DE">glyph</span></div>
    <div class="cell"><img src="svg/logo-horizontal-dark.svg" height="96" alt=""><span style="color:#F2E9DE">wordmark</span></div>
  </div>

  <h2>Palette</h2>
  <div class="sw">
    <div><div class="chip" style="background:#2F4858"></div><code>#2F4858</code><br><span>shelter</span></div>
    <div><div class="chip" style="background:#F2E9DE"></div><code>#F2E9DE</code><br><span>arch</span></div>
    <div><div class="chip" style="background:#E8B04B"></div><code>#E8B04B</code><br><span>hearth</span></div>
    <div><div class="chip" style="background:#1C2B33"></div><code>#1C2B33</code><br><span>ink</span></div>
  </div>
</main>
