# Repository hygiene checks.
#
# Deliberately modest. docs/ARCHITECTURE.md ("CI reality") explains why: a
# GitHub-hosted runner cannot build Chromium — it does not have the disk for the
# source tree, let alone the build. Real builds move to a self-hosted or cloud macOS
# builder (ADR due before M1). Until then CI does the things it genuinely can do, and
# does not pretend to do the rest.
#
# Every check here also runs locally with the same command, so a red CI is always
# reproducible on a developer machine.

name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        run: |
          # Every executable shell script under tooling/, plus the sourced library.
          mapfile -t scripts < <(
            git ls-files 'tooling/*' |
            while read -r f; do
              head -1 "$f" | grep -q '^#!.*\(bash\|sh\)$' && echo "$f"
            done
          )
          scripts+=(tooling/lib.sh)
          printf 'checking: %s\n' "${scripts[@]}"
          shellcheck -x "${scripts[@]}"

      - name: bash syntax
        run: |
          for f in $(git ls-files 'tooling/*'); do
            if head -1 "$f" | grep -q '^#!.*\(bash\|sh\)$'; then
              bash -n "$f"
            fi
          done

  repo:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Documentation links, ADR format, patch series, no machine paths
        run: tooling/check-repo
