<!doctype html><html><head><meta charset="utf-8"><title>Canvas</title><style>body{font:16px/1.5 system-ui;margin:40px;max-width:900px}</style><script>window.addEventListener("load",()=>{const c=document.getElementById("c").getContext("2d");let t=0;function f(){t++;c.fillStyle="#222";c.fillRect(0,0,800,500);for(let i=0;i<300;i++){c.fillStyle=`hsl(${(i*5+t)%360},70%,60%)`;c.beginPath();c.arc(400+Math.cos(i+t/30)*300,250+Math.sin(i*1.3+t/40)*200,6,0,7);c.fill()}requestAnimationFrame(f)}f()})</script></head><body><h1>Canvas</h1><canvas id="c" width="800" height="500"></canvas></body></html>
