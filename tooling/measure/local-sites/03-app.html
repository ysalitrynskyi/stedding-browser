<!doctype html><html><head><meta charset="utf-8"><title>DOM app</title><style>body{font:16px/1.5 system-ui;margin:40px;max-width:900px}</style><script>window.addEventListener("load",()=>{const r=document.getElementById("root");const items=[];for(let i=0;i<5000;i++){const d=document.createElement("div");d.textContent="row "+i+" "+Math.random().toString(36);items.push(d);r.appendChild(d)}setInterval(()=>{for(let i=0;i<200;i++){items[(Math.random()*items.length)|0].textContent="row "+Math.random().toString(36)}},250)})</script></head><body><h1>DOM app</h1><div id="root"></div></body></html>
